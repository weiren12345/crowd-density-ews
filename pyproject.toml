[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdw"
version = "0.1.0"
description = "Crowd density early-warning system for pedestrian bottlenecks"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# OneDrive blocks the directory rename pytest uses for its cache.
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
